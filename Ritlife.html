<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritlife - Life Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .slide-up { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        /* BitLife-style striped background */
        .bg-bitlife-menu { background-color: #f3f4f6; }
        .bitlife-row:active { background-color: #e5e7eb; transform: scale(0.99); }
        .bg-stripes-gray { background-image: repeating-linear-gradient(45deg, #e5e7eb, #e5e7eb 10px, #f3f4f6 10px, #f3f4f6 20px); }
    </style>
</head>
<body class="bg-gray-900 h-screen w-full flex justify-center items-center overflow-hidden">

    <div id="root" class="h-full w-full max-w-md bg-white shadow-2xl relative flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICON COMPONENTS ---
        const Icon = ({ char, color }) => <span className={`text-xl mr-3 ${color || 'text-gray-600'}`}>{char}</span>;

        // --- GAME DATA ---
        const COUNTRIES = ["USA", "UK", "Canada", "Australia", "Japan", "France", "Germany", "Brazil", "South Korea", "Spain", "Italy", "Sweden"];
        const FIRST_NAMES_M = ["Liam", "Noah", "Oliver", "Elijah", "James", "William", "Benjamin", "Lucas", "Henry", "Theodore"];
        const FIRST_NAMES_F = ["Olivia", "Emma", "Charlotte", "Amelia", "Ava", "Sophia", "Isabella", "Mia", "Evelyn", "Harper"];
        const LAST_NAMES = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez"];

        const SPORTS_DATA = {
            Football: { teams: ["KC Chiefs", "SF 49ers", "Ravens", "Lions", "Bills", "Cowboys", "Eagles"], baseSalary: 5000000 },
            Basketball: { teams: ["Lakers", "Celtics", "Warriors", "Bulls", "Heat", "Knicks"], baseSalary: 7000000 },
            Baseball: { teams: ["Yankees", "Dodgers", "Red Sox", "Cubs", "Cardinals"], baseSalary: 4000000 },
            Soccer: { teams: ["Real Madrid", "Barcelona", "Man City", "Liverpool", "Bayern"], baseSalary: 8000000 },
            Hockey: { teams: ["Maple Leafs", "Canadiens", "Bruins", "Rangers"], baseSalary: 3000000 }
        };

        const JOBS = [
            { title: "Dishwasher", salary: 15000, reqSmarts: 0, reqEd: "None" },
            { title: "Cashier", salary: 20000, reqSmarts: 10, reqEd: "None" },
            { title: "Plumber Apprentice", salary: 35000, reqSmarts: 20, reqEd: "High School" },
            { title: "Jr. Developer", salary: 55000, reqSmarts: 60, reqEd: "University" },
            { title: "Accountant", salary: 60000, reqSmarts: 70, reqEd: "University" },
            { title: "Nurse", salary: 65000, reqSmarts: 65, reqEd: "University" },
            { title: "Lawyer", salary: 90000, reqSmarts: 85, reqEd: "Law School" },
            { title: "Brain Surgeon", salary: 180000, reqSmarts: 95, reqEd: "Medical School" },
        ];

        const HOUSES = [
            { name: "Trailer", price: 25000, upkeep: 500 },
            { name: "Tiny Home", price: 60000, upkeep: 1000 },
            { name: "Studio Apt", price: 120000, upkeep: 2000 },
            { name: "Suburban House", price: 350000, upkeep: 5000 },
            { name: "Mansion", price: 2500000, upkeep: 25000 },
            { name: "Private Island", price: 50000000, upkeep: 500000 },
        ];

        const CARS = [
            { name: "Rusty Sedan", price: 2000, upkeep: 500 },
            { name: "Used Hatchback", price: 8000, upkeep: 1000 },
            { name: "New Sedan", price: 25000, upkeep: 2000 },
            { name: "Sports Car", price: 65000, upkeep: 5000 },
            { name: "Supercar", price: 250000, upkeep: 15000 },
        ];

        // --- SUB-COMPONENTS ---

        const StatBar = ({ label, value, color }) => (
            <div className="flex-1 flex flex-col items-center">
                <div className="text-[10px] font-bold text-gray-500 uppercase tracking-tighter mb-0.5">{label}</div>
                <div className="w-full h-4 bg-gray-200 rounded-full overflow-hidden border border-gray-300 relative">
                    <div className={`h-full ${color}`} style={{ width: `${value}%` }}></div>
                    <div className="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-black/50">{value}%</div>
                </div>
            </div>
        );

        const MenuRow = ({ icon, title, subtitle, onClick, rightText, color }) => (
            <button onClick={onClick} className="w-full flex items-center justify-between p-4 bg-white border-b border-gray-100 bitlife-row text-left">
                <div className="flex items-center">
                    <div className={`w-8 h-8 rounded flex items-center justify-center text-xl mr-3 ${color || 'bg-gray-100'}`}>{icon}</div>
                    <div>
                        <div className="font-semibold text-gray-800 text-sm">{title}</div>
                        {subtitle && <div className="text-xs text-gray-500">{subtitle}</div>}
                    </div>
                </div>
                {rightText && <div className="text-sm font-bold text-gray-400">{rightText} ›</div>}
                {!rightText && <div className="text-gray-300">›</div>}
            </button>
        );

        const Modal = ({ title, children, onClose }) => (
            <div className="absolute inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center animate-in fade-in duration-200">
                <div className="bg-gray-100 w-full sm:w-[90%] sm:rounded-xl h-[85%] sm:h-auto sm:max-h-[80%] flex flex-col shadow-2xl slide-up overflow-hidden">
                    <div className="bg-white p-4 border-b flex justify-between items-center sticky top-0 z-10">
                        <h2 className="text-lg font-black text-gray-800 uppercase tracking-wide">{title}</h2>
                        <button onClick={onClose} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded-lg text-sm font-bold">Close</button>
                    </div>
                    <div className="overflow-y-auto p-4 space-y-2 flex-1">
                        {children}
                    </div>
                </div>
            </div>
        );

        // --- MAIN GAME COMPONENT ---

        function Ritlife() {
            // State
            const [gameState, setGameState] = useState("menu");
            const [age, setAge] = useState(0);
            const [name, setName] = useState("");
            const [gender, setGender] = useState("");
            const [country, setCountry] = useState("");
            const [money, setMoney] = useState(0);
            const [stats, setStats] = useState({ happiness: 100, health: 100, smarts: 50, looks: 50, fame: 0, athletics: 20 });
            const [logs, setLogs] = useState([]);
            const [relationships, setRelationships] = useState([]);
            const [assets, setAssets] = useState({ houses: [], cars: [] });
            
            // Career
            const [education, setEducation] = useState("None");
            const [job, setJob] = useState(null);
            const [salary, setSalary] = useState(0);
            const [currentSchool, setCurrentSchool] = useState(null);
            const [studyYearsLeft, setStudyYearsLeft] = useState(0);
            const [sportCareer, setSportCareer] = useState(null); 
            const [sportTeam, setSportTeam] = useState(null);
            const [contract, setContract] = useState(null);
            const [injury, setInjury] = useState(null);
            const [canEnterDraft, setCanEnterDraft] = useState(false);
            const [sportType, setSportType] = useState(null);
            const [actingGig, setActingGig] = useState(null);

            // Other
            const [yearlyActions, setYearlyActions] = useState({});
            const [socials, setSocials] = useState({ youtube: 0, onlyfans: 0, babyJaycetube: 0 });
            const [prisonYears, setPrisonYears] = useState(0);
            const [generation, setGeneration] = useState(1);
            const [ancestors, setAncestors] = useState([]);
            
            // UI
            const [tab, setTab] = useState("life");
            const [modal, setModal] = useState(null);
            const [minigameState, setMinigameState] = useState(null); // For burglary
            const logsEndRef = useRef(null);
            
            // Sandbox Settings
            const [customName, setCustomName] = useState("");
            const [customGender, setCustomGender] = useState("Male");
            const [customCountry, setCustomCountry] = useState(COUNTRIES[0]);
            const [sandboxMode, setSandboxMode] = useState(false);

            // --- ENGINE ---

            const initGame = (isCustom) => {
                // Determine Identity
                const g = isCustom ? customGender : (Math.random() > 0.5 ? "Male" : "Female");
                const c = isCustom ? customCountry : COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
                
                let f, l;
                if (isCustom && customName.trim() !== "") {
                    // Use Custom Name
                    const parts = customName.split(' ');
                    f = parts[0];
                    l = parts.slice(1).join(' ') || LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
                } else {
                    // Random Name
                    f = g === "Male" ? FIRST_NAMES_M[Math.floor(Math.random()*FIRST_NAMES_M.length)] : FIRST_NAMES_F[Math.floor(Math.random()*FIRST_NAMES_F.length)];
                    l = LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
                }
                
                setName(`${f} ${l}`);
                setGender(g);
                setCountry(c);
                setAge(0);
                setMoney(sandboxMode ? 1000000000 : 0);
                setStats({
                    happiness: sandboxMode ? 100 : 90,
                    health: sandboxMode ? 100 : 90,
                    smarts: sandboxMode ? 100 : Math.floor(Math.random()*60)+20,
                    looks: sandboxMode ? 100 : Math.floor(Math.random()*60)+20,
                    fame: 0,
                    athletics: sandboxMode ? 100 : Math.floor(Math.random()*40)+10
                });
                setEducation("None"); setJob(null); setSalary(0); setCurrentSchool(null); setStudyYearsLeft(0);
                setSportCareer(null); setContract(null); setInjury(null); setActingGig(null);
                setPrisonYears(0); setAssets({houses:[], cars:[]}); setRelationships([]);
                
                // Create Parents
                const mom = { id: 1, name: `${FIRST_NAMES_F[0]} ${l}`, relation: "Mother", age: 24, bar: 90 };
                const dad = { id: 2, name: `${FIRST_NAMES_M[0]} ${l}`, relation: "Father", age: 26, bar: 90 };
                setRelationships([mom, dad]);
                
                setLogs([{age: 0, text: `👶 Life began in ${c}. ${sandboxMode ? '(Sandbox)' : ''}`}]);
                setGameState("playing");
            };

            const addLog = (text) => setLogs(p => [...p, {age, text}]);
            
            const updateStat = (k, v) => setStats(p => ({...p, [k]: Math.max(0, Math.min(100, p[k]+v))}));
            
            const checkLimit = (key, max) => {
                if ((yearlyActions[key] || 0) >= max) {
                    addLog("⏳ You've done that enough this year.");
                    return false;
                }
                setYearlyActions(p => ({...p, [key]: (p[key]||0)+1}));
                return true;
            };

            const handleAgeUp = () => {
                if (gameState === 'dead') return;
                const nextAge = age + 1;
                setAge(nextAge);
                setYearlyActions({});
                let newLogs = [];

                // Prison Logic
                if (gameState === 'prison') {
                    if (prisonYears > 1) {
                        setPrisonYears(p => p - 1);
                        newLogs.push(`🔒 ${prisonYears-1} years left in prison.`);
                        updateStat('happiness', -10);
                    } else {
                        setGameState('playing');
                        setPrisonYears(0);
                        newLogs.push("🔓 You were released from prison!");
                    }
                    newLogs.forEach(l => setLogs(p => [...p, {age: nextAge, text: l}]));
                    return;
                }

                // Aging Logic (Education, Career, Money, Events same as before)
                // ... (Condensed for brevity, assumed same logic as previous request)
                if (currentSchool && studyYearsLeft > 0) {
                    setStudyYearsLeft(p => p - 1);
                    if (studyYearsLeft - 1 === 0) {
                        newLogs.push(`🎓 Graduated from ${currentSchool}!`);
                        setEducation("Degree"); setCurrentSchool(null);
                    }
                } else if (nextAge===18) { newLogs.push("🎓 Graduated High School."); setEducation("HS Grad"); }

                let income = job ? salary : 0;
                setMoney(m => m + income);
                if (income > 0) newLogs.push(`💸 Earned $${income.toLocaleString()}`);

                // Random Events
                if (Math.random() > 0.8) newLogs.push("🎲 Nothing interesting happened.");

                // Relationships Age
                setRelationships(prev => prev.map(r => ({...r, age: r.age+1})));

                if (stats.health <= 0 || (nextAge > 100 && Math.random() > 0.8)) {
                    setGameState('dead');
                    newLogs.push("💀 You have died.");
                }

                newLogs.forEach(l => setLogs(p => [...p, {age: nextAge, text: l}]));
            };

            useEffect(() => {
                if (logsEndRef.current) logsEndRef.current.scrollIntoView({ behavior: "smooth" });
            }, [logs, tab]);

            // --- ACTIONS ---

            const doAction = (type, payload) => {
                if (type === 'emigrate') {
                    if (money < 5000) { addLog("❌ Emigration costs $5,000."); return; }
                    setMoney(m => m - 5000);
                    setCountry(payload);
                    addLog(`✈️ Emigrated to ${payload}.`);
                    setModal(null);
                }
                // ... Other actions (Job, Uni, etc.)
            };

            // --- BURGLARY MINIGAME ---
            
            const startBurglary = () => {
                // Initialize Grid: 4x4. 
                // 0: Empty, 1: Player, 2: Loot, 3: Dog, 4: Exit
                const newGrid = Array(16).fill(0);
                const playerPos = 0; 
                const exitPos = 15;
                // Random Loot
                let lootPos = [];
                while(lootPos.length < 3) {
                    let r = Math.floor(Math.random() * 14) + 1;
                    if (!lootPos.includes(r)) lootPos.push(r);
                }
                // Dog
                let dogPos = Math.floor(Math.random() * 10) + 4; 
                
                setMinigameState({
                    grid: newGrid,
                    player: playerPos,
                    dog: dogPos,
                    exit: exitPos,
                    loot: lootPos,
                    collected: 0,
                    status: 'playing' // playing, won, lost
                });
                setModal('burglary');
            };

            const movePlayer = (dir) => {
                if (!minigameState || minigameState.status !== 'playing') return;
                let next = minigameState.player;
                if (dir === 'up') next -= 4;
                if (dir === 'down') next += 4;
                if (dir === 'left' && next % 4 !== 0) next -= 1;
                if (dir === 'right' && (next + 1) % 4 !== 0) next += 1;

                if (next < 0 || next > 15) return;

                // Check collision
                if (next === minigameState.dog) {
                    setMinigameState(p => ({...p, status: 'lost'}));
                    return;
                }

                let newLoot = [...minigameState.loot];
                let newCollected = minigameState.collected;
                if (newLoot.includes(next)) {
                    newLoot = newLoot.filter(l => l !== next);
                    newCollected++;
                }

                // Check Win
                if (next === minigameState.exit) {
                    if (newCollected > 0) { // Must collect at least 1 loot
                        setMinigameState(p => ({...p, player: next, loot: newLoot, collected: newCollected, status: 'won'}));
                        return;
                    }
                }

                // Move Dog Randomly
                let dogNext = minigameState.dog;
                const dogMove = Math.random();
                if (dogMove < 0.25 && dogNext > 3) dogNext -= 4;
                else if (dogMove < 0.5 && dogNext < 12) dogNext += 4;
                else if (dogMove < 0.75 && dogNext % 4 !== 0) dogNext -= 1;
                else if ((dogNext + 1) % 4 !== 0) dogNext += 1;

                if (dogNext === next) {
                    setMinigameState(p => ({...p, player: next, loot: newLoot, collected: newCollected, dog: dogNext, status: 'lost'}));
                    return;
                }

                setMinigameState(p => ({...p, player: next, loot: newLoot, collected: newCollected, dog: dogNext}));
            };

            const endBurglary = () => {
                if (minigameState.status === 'won') {
                    const take = minigameState.collected * 5000;
                    setMoney(m => m + take);
                    addLog(`💰 Burglary successful! Stole $${take.toLocaleString()}.`);
                    updateStat('fame', -5);
                } else {
                    addLog("🐕 Caught by the dog! Arrested.");
                    setGameState('prison');
                    setPrisonYears(3);
                    updateStat('happiness', -50);
                }
                setModal(null);
                setMinigameState(null);
            };

            // --- RENDER HELPERS ---

            if (gameState === 'menu') {
                return (
                    <div className="h-full w-full bg-slate-900 flex flex-col items-center justify-center p-6 text-white space-y-6">
                        <h1 className="text-6xl font-black text-yellow-400 tracking-tighter drop-shadow-lg">RITLIFE</h1>
                        
                        <div className="w-full max-w-xs space-y-3 bg-slate-800 p-6 rounded-2xl shadow-xl">
                            <h2 className="text-xl font-bold text-center border-b border-gray-600 pb-2 mb-4">New Game</h2>
                            
                            {/* CUSTOM OPTIONS */}
                            <div>
                                <label className="text-xs font-bold text-gray-400 uppercase">Name</label>
                                <input type="text" placeholder="Random Name" className="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:border-yellow-400 outline-none text-sm" value={customName} onChange={e=>setCustomName(e.target.value)} />
                            </div>
                            
                            <div className="flex gap-2">
                                <div className="flex-1">
                                    <label className="text-xs font-bold text-gray-400 uppercase">Gender</label>
                                    <select value={customGender} onChange={e=>setCustomGender(e.target.value)} className="w-full p-2 rounded bg-slate-700 border border-slate-600 text-sm">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                                <div className="flex-1">
                                    <label className="text-xs font-bold text-gray-400 uppercase">Country</label>
                                    <select value={customCountry} onChange={e=>setCustomCountry(e.target.value)} className="w-full p-2 rounded bg-slate-700 border border-slate-600 text-sm">
                                        {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                            </div>

                            <label className="flex items-center gap-2 p-2 rounded bg-slate-700/50 cursor-pointer hover:bg-slate-700 transition">
                                <input type="checkbox" checked={sandboxMode} onChange={e=>setSandboxMode(e.target.checked)} className="accent-yellow-400"/>
                                <span className="text-sm font-bold text-yellow-400">Sandbox Mode (God Mode)</span>
                            </label>

                            <div className="flex flex-col gap-2 pt-2">
                                <button onClick={() => initGame(true)} className="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-white shadow transition-transform active:scale-95">Start Custom Life</button>
                                <div className="text-center text-xs text-gray-500 font-bold">- OR -</div>
                                <button onClick={() => initGame(false)} className="w-full py-3 bg-green-600 hover:bg-green-500 rounded-lg font-bold text-white shadow transition-transform active:scale-95">Start Random Life</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'dead') {
                return (
                    <div className="h-full w-full bg-slate-900 flex flex-col items-center justify-center p-6 text-white text-center">
                        <div className="text-6xl mb-4">🪦</div>
                        <h2 className="text-4xl font-bold mb-2">R.I.P.</h2>
                        <p className="text-xl text-gray-400 mb-6">{name} died at age {age}.</p>
                        <div className="bg-slate-800 p-4 rounded-lg w-full max-w-xs mb-6">
                            <p>Net Worth: <span className="text-green-400">${money.toLocaleString()}</span></p>
                            <p>Career: {job ? job.title : "Unemployed"}</p>
                        </div>
                        <button onClick={() => setGameState('menu')} className="bg-blue-600 px-8 py-3 rounded-full font-bold">Main Menu</button>
                    </div>
                );
            }

            // GAMEPLAY UI
            return (
                <div className="h-full flex flex-col bg-gray-100">
                    {/* STATUS BAR */}
                    <div className="bg-white p-3 flex justify-between items-center shadow-sm z-10 border-b border-gray-200">
                        <div className="flex items-center gap-2">
                            {/* Restored Header Buttons */}
                            <button onClick={() => setModal('tree')} className="text-xl text-gray-500 p-1 hover:bg-gray-100 rounded">🌳</button>
                            {sandboxMode && <button onClick={() => setModal('editor')} className="text-xl text-yellow-500 p-1 hover:bg-yellow-50 rounded">✏️</button>}
                            
                            <div className="flex flex-col ml-2">
                                <span className="font-black text-lg text-gray-800 leading-none">{name}</span>
                                <span className="text-xs text-gray-500">{job ? job.title : "Unemployed"} • {age}yo • {country}</span>
                            </div>
                        </div>
                        <div className="text-green-600 font-black text-lg">${money.toLocaleString()}</div>
                    </div>

                    {/* STATS BARS */}
                    <div className="bg-white px-4 pb-3 pt-1 flex gap-2 border-b border-gray-200 shadow-sm z-10">
                        <StatBar label="Happiness" value={stats.happiness} color="bg-green-500" />
                        <StatBar label="Health" value={stats.health} color="bg-rose-500" />
                        <StatBar label="Smarts" value={stats.smarts} color="bg-blue-500" />
                        <StatBar label="Looks" value={stats.looks} color="bg-orange-500" />
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 overflow-hidden relative bg-white">
                        
                        {/* TAB: LIFE (LOGS) */}
                        {tab === 'life' && (
                            <div className="h-full overflow-y-auto p-4 pb-32">
                                {gameState === 'prison' && (
                                    <div className="bg-stripes-gray p-6 mb-4 border-2 border-black text-center">
                                        <div className="text-4xl mb-2">🔒</div>
                                        <div className="font-black text-xl">PRISON</div>
                                        <div className="font-mono text-sm">{prisonYears} YEARS REMAINING</div>
                                    </div>
                                )}
                                <div className="space-y-3">
                                    {logs.map((l, i) => (
                                        <div key={i} className="flex gap-3 text-sm text-gray-800 border-b border-gray-100 pb-2 last:border-0">
                                            <div className="font-bold text-gray-400 min-w-[24px] text-right">{l.age}</div>
                                            <div className="flex-1">{l.text}</div>
                                        </div>
                                    ))}
                                    <div ref={logsEndRef} />
                                </div>
                            </div>
                        )}

                        {/* TAB: OCCUPATION (Same as before) */}
                        {tab === 'occupation' && (
                            <div className="h-full overflow-y-auto bg-gray-50 pb-24">
                                <div className="p-4 uppercase text-xs font-bold text-gray-400 ml-2">Education & Career</div>
                                {job ? (
                                    <MenuRow icon="💼" title={job.title} subtitle={`Salary: $${salary.toLocaleString()}`} color="bg-green-100 text-green-600" onClick={() => {addLog("Quit job."); setJob(null);}} rightText="Quit" />
                                ) : (
                                    <MenuRow icon="👔" title="Jobs" subtitle="Full-time employment" onClick={() => setModal('jobs')} color="bg-green-100 text-green-600" />
                                )}
                            </div>
                        )}

                        {/* TAB: ACTIVITIES */}
                        {tab === 'activities' && (
                            <div className="h-full overflow-y-auto bg-gray-50 pb-24">
                                <div className="p-4 uppercase text-xs font-bold text-gray-400 ml-2">Mind & Body</div>
                                <MenuRow icon="🩺" title="Doctor" subtitle="Consult a physician ($200)" onClick={() => {if(money<200)return; setMoney(m=>m-200); updateStat('health',20); addLog("Doctor visit.");}} color="bg-red-100 text-red-600" />
                                <MenuRow icon="🧘" title="Mind & Body" subtitle="Meditate, Gym, Walk" onClick={() => setModal('mindbody')} color="bg-blue-100 text-blue-600" />
                                
                                <div className="p-4 uppercase text-xs font-bold text-gray-400 ml-2 mt-2">Entertainment</div>
                                <MenuRow icon="⛰️" title="Outdoor" subtitle="Hiking, Mudding, Exploring (18+)" onClick={() => setModal('outdoor')} color="bg-green-100 text-green-600" />
                                <MenuRow icon="✈️" title="Emigrate" subtitle="Move to another country" onClick={() => setModal('emigrate')} color="bg-cyan-100 text-cyan-600" />
                                
                                <div className="p-4 uppercase text-xs font-bold text-gray-400 ml-2 mt-2">Crime</div>
                                <MenuRow icon="🔪" title="Crime" subtitle="Commit crimes" onClick={() => setModal('crime_menu')} color="bg-gray-800 text-white" />
                            </div>
                        )}

                        {/* TAB: ASSETS */}
                        {tab === 'assets' && (
                            <div className="h-full overflow-y-auto bg-gray-50 pb-24">
                                <div className="p-4 uppercase text-xs font-bold text-gray-400 ml-2">Shopping</div>
                                <MenuRow icon="🏠" title="Real Estate" subtitle="Buy houses" onClick={() => setModal('realestate')} color="bg-orange-100 text-orange-600" />
                                <MenuRow icon="🚗" title="Vehicles" subtitle="Buy cars" onClick={() => setModal('cars')} color="bg-blue-100 text-blue-600" />
                                <div className="p-4 uppercase text-xs font-bold text-gray-400 ml-2 mt-2">Your Assets</div>
                                {assets.houses.length === 0 && assets.cars.length === 0 && <div className="p-4 text-center text-gray-400 italic">You own nothing.</div>}
                                {assets.houses.map((h, i) => <MenuRow key={i} icon="🏠" title={h.name} subtitle="Property" />)}
                                {assets.cars.map((c, i) => <MenuRow key={i} icon="🚗" title={c.name} subtitle="Vehicle" />)}
                            </div>
                        )}

                    </div>

                    {/* BIG AGE BUTTON */}
                    <div className="absolute bottom-20 left-0 right-0 flex justify-center pointer-events-none">
                        <button 
                            onClick={handleAgeUp}
                            className="bg-green-500 pointer-events-auto text-white w-20 h-20 rounded-full shadow-xl flex items-center justify-center border-4 border-white active:scale-95 transition-transform"
                        >
                            <span className="font-black text-xl">+</span>
                            <span className="font-bold text-xs absolute bottom-4">AGE</span>
                        </button>
                    </div>

                    {/* BOTTOM NAVIGATION */}
                    <div className="bg-white border-t border-gray-200 h-16 flex justify-around items-center z-20 pb-safe">
                        <button onClick={() => setTab('life')} className={`flex flex-col items-center p-2 ${tab==='life'?'text-green-600':'text-gray-400'}`}>
                            <span className="text-xl">⚡</span>
                            <span className="text-[10px] font-bold uppercase mt-1">Age</span>
                        </button>
                        <button onClick={() => setTab('occupation')} className={`flex flex-col items-center p-2 ${tab==='occupation'?'text-green-600':'text-gray-400'}`}>
                            <span className="text-xl">💼</span>
                            <span className="text-[10px] font-bold uppercase mt-1">Job</span>
                        </button>
                        <div className="w-16"></div> 
                        <button onClick={() => setTab('activities')} className={`flex flex-col items-center p-2 ${tab==='activities'?'text-green-600':'text-gray-400'}`}>
                            <span className="text-xl">🧸</span>
                            <span className="text-[10px] font-bold uppercase mt-1">Acts</span>
                        </button>
                        <button onClick={() => setTab('assets')} className={`flex flex-col items-center p-2 ${tab==='assets'?'text-green-600':'text-gray-400'}`}>
                            <span className="text-xl">💎</span>
                            <span className="text-[10px] font-bold uppercase mt-1">Assets</span>
                        </button>
                    </div>

                    {/* --- MODALS --- */}

                    {/* CRIME MENU */}
                    {modal === 'crime_menu' && (
                        <Modal title="Commit A Crime" onClose={() => setModal(null)}>
                            <MenuRow icon="🍫" title="Shoplift" subtitle="Risk: Low" onClick={() => {if(Math.random()>0.2){setMoney(m=>m+50);addLog("Stole candy.");}else{addLog("Caught shoplifting!");setModal(null);}}} />
                            <MenuRow icon="🏚️" title="Rob House" subtitle="Play Minigame" onClick={startBurglary} />
                            <MenuRow icon="🚙" title="Grand Theft Auto" subtitle="Risk: High" onClick={() => {if(Math.random()>0.5){setMoney(m=>m+5000);addLog("Stole a car!");}else{addLog("Caught stealing car! Prison!");setGameState('prison');setPrisonYears(5);setModal(null);}}} />
                            <MenuRow icon="🏦" title="Bank Robbery" subtitle="Risk: Extreme" onClick={() => {if(Math.random()>0.8){setMoney(m=>m+100000);addLog("Robbed bank! $100k!");}else{addLog("Caught by police! 10 years.");setGameState('prison');setPrisonYears(10);setModal(null);}}} />
                        </Modal>
                    )}

                    {/* BURGLARY MINIGAME */}
                    {modal === 'burglary' && minigameState && (
                        <div className="absolute inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-gray-800 p-4 rounded-xl w-full max-w-sm text-center">
                                <h3 className="text-white font-bold text-xl mb-4">HOUSE BURGLARY</h3>
                                <div className="grid grid-cols-4 gap-1 bg-gray-900 p-1 rounded mb-4 aspect-square">
                                    {minigameState.grid.map((_, i) => {
                                        let content = '';
                                        if (i === minigameState.player) content = '🥷';
                                        else if (i === minigameState.dog) content = '🐕';
                                        else if (i === minigameState.exit) content = '🚪';
                                        else if (minigameState.loot.includes(i)) content = '💰';
                                        
                                        return (
                                            <div key={i} className="bg-gray-700 rounded flex items-center justify-center text-2xl">
                                                {content}
                                            </div>
                                        );
                                    })}
                                </div>
                                {minigameState.status === 'playing' ? (
                                    <div className="grid grid-cols-3 gap-2">
                                        <div></div>
                                        <button onClick={() => movePlayer('up')} className="bg-gray-600 p-3 rounded text-white font-bold">⬆️</button>
                                        <div></div>
                                        <button onClick={() => movePlayer('left')} className="bg-gray-600 p-3 rounded text-white font-bold">⬅️</button>
                                        <button onClick={() => movePlayer('down')} className="bg-gray-600 p-3 rounded text-white font-bold">⬇️</button>
                                        <button onClick={() => movePlayer('right')} className="bg-gray-600 p-3 rounded text-white font-bold">➡️</button>
                                    </div>
                                ) : (
                                    <div>
                                        <div className={`text-2xl font-black mb-4 ${minigameState.status === 'won' ? 'text-green-400' : 'text-red-500'}`}>
                                            {minigameState.status === 'won' ? 'ESCAPED!' : 'CAUGHT!'}
                                        </div>
                                        <button onClick={endBurglary} className="bg-white text-black px-6 py-2 rounded font-bold">Continue</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* EMIGRATE */}
                    {modal === 'emigrate' && (
                        <Modal title="Emigrate" onClose={() => setModal(null)}>
                            {COUNTRIES.map(c => (
                                c !== country && <MenuRow key={c} icon="✈️" title={c} subtitle="Cost: $5,000" onClick={() => doAction('emigrate', c)} />
                            ))}
                        </Modal>
                    )}

                    {/* FAMILY TREE */}
                    {modal === 'tree' && (
                        <Modal title="Family Tree" onClose={() => setModal(null)}>
                            <div className="text-center p-4 bg-gray-200 rounded mb-4">
                                <div className="text-4xl">👶</div>
                                <div className="font-bold text-lg">{name}</div>
                                <div className="text-xs text-gray-500">Age {age}</div>
                            </div>
                            <div className="space-y-2">
                                {relationships.map((r, i) => (
                                    <div key={i} className="flex justify-between p-3 bg-white border rounded">
                                        <div>
                                            <div className="font-bold">{r.name}</div>
                                            <div className="text-xs text-gray-500">{r.relation} • Age {r.age}</div>
                                        </div>
                                        <div className={`text-sm font-bold ${r.bar > 50 ? 'text-green-500' : 'text-red-500'}`}>{r.bar}%</div>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}

                    {/* SANDBOX EDITOR */}
                    {modal === 'editor' && (
                        <Modal title="Sandbox Editor" onClose={() => setModal(null)}>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold uppercase text-gray-500">Bank Balance</label>
                                    <input type="number" value={money} onChange={e=>setMoney(Number(e.target.value))} className="w-full p-2 border rounded"/>
                                </div>
                                {Object.keys(stats).map(k => (
                                    <div key={k}>
                                        <div className="flex justify-between text-xs font-bold uppercase text-gray-500"><span>{k}</span><span>{stats[k]}%</span></div>
                                        <input type="range" className="w-full" value={stats[k]} onChange={e=>updateStat(k, Number(e.target.value)-stats[k])}/>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}

                    {/* OTHER MODALS (Jobs, etc. same as before, simplified for this snippet) */}
                    {modal === 'jobs' && (
                        <Modal title="Jobs" onClose={() => setModal(null)}>
                            {JOBS.map((j,i) => <MenuRow key={i} icon="👔" title={j.title} subtitle={`$${j.salary}`} onClick={() => {setJob(j);setSalary(j.salary);setModal(null);addLog(`Hired as ${j.title}`);}} />)}
                        </Modal>
                    )}
                    {modal === 'mindbody' && (
                        <Modal title="Mind & Body" onClose={() => setModal(null)}>
                            <MenuRow icon="🏋️" title="Gym" subtitle="Workout" onClick={()=>{updateStat('health',5);addLog("Gym.");setModal(null);}} />
                            <MenuRow icon="🧘" title="Meditate" onClick={()=>{updateStat('happiness',5);addLog("Zen.");setModal(null);}} />
                        </Modal>
                    )}
                    {modal === 'outdoor' && (
                        <Modal title="Outdoor Activities" onClose={() => setModal(null)}>
                            <MenuRow icon="🚙" title="Mudding" onClick={()=>{if(age<18){addLog("Too young");return;} addLog("Went mudding."); setModal(null);}} />
                            <MenuRow icon="⛰️" title="Hiking" onClick={()=>{addLog("Went hiking."); setModal(null);}} />
                        </Modal>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Ritlife />);
    </script>
</body>
</html>
