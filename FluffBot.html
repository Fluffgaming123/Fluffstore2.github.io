<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluff Chat - Multiverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25%); }
        }
        .animate-bounce-dot { animation: bounce 1s infinite; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }

        /* CRASHOUT ANIMATIONS */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .crashout-mode { animation: shake 0.5s infinite; }
        .crashout-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 0, 0, 0.2);
            pointer-events: none; z-index: 50; display: none;
        }
        .crashout-active .crashout-overlay { display: block; }

        /* Transitions */
        .hidden-view { display: none !important; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans text-gray-900 dark:text-gray-100 h-screen flex flex-col overflow-hidden transition-colors duration-200">

    <div class="crashout-overlay"></div>

    <!-- MAIN MENU VIEW -->
    <div id="menu-view" class="flex-1 flex flex-col p-6 overflow-y-auto">
        <div class="max-w-4xl mx-auto w-full">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Select Your Fluff</h1>
                    <p class="text-gray-500 dark:text-gray-400">Who do you want to vibe with today?</p>
                </div>
                <button id="menu-theme-toggle" class="p-3 rounded-full bg-white dark:bg-gray-800 shadow-sm hover:shadow-md transition-all">
                    <i data-lucide="moon" class="w-6 h-6 block dark:hidden"></i>
                    <i data-lucide="sun" class="w-6 h-6 hidden dark:block"></i>
                </button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="persona-grid">
                <!-- Cards injected by JS -->
            </div>
        </div>
    </div>

    <!-- CHAT VIEW (Hidden by default) -->
    <div id="chat-view" class="hidden-view flex-1 flex flex-col h-full absolute inset-0 bg-gray-100 dark:bg-gray-900 z-20">
        <!-- Header -->
        <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 shadow-sm flex items-center justify-between sticky top-0 z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button id="back-button" class="p-2 -ml-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-gray-600 dark:text-gray-300"></i>
                </button>
                <div class="relative">
                    <div class="w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden border-2 border-blue-200 dark:border-blue-900 flex items-center justify-center avatar-container">
                        <!-- Avatar injected -->
                    </div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-gray-800 rounded-full"></div>
                </div>
                <div>
                    <h1 id="chat-header-name" class="font-bold text-lg text-gray-800 dark:text-white">Fluff</h1>
                    <p id="chat-header-status" class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1">
                        <!-- Status injected -->
                    </p>
                </div>
            </div>
            <div class="flex gap-2">
                <button class="p-2 text-gray-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i data-lucide="more-vertical" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-950 scroll-smooth">
            <!-- Messages injected -->
        </main>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="hidden px-4 pb-4 w-full flex justify-start">
            <div class="flex gap-2 items-end">
                <div class="w-8 h-8 bg-white dark:bg-gray-800 rounded-full border border-gray-200 dark:border-gray-700 p-0.5 overflow-hidden avatar-small-container"></div>
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3 rounded-2xl rounded-bl-none shadow-sm">
                    <div class="flex gap-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce-dot"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce-dot delay-100"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce-dot delay-200"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <footer class="bg-white dark:bg-gray-800 p-4 border-t border-gray-200 dark:border-gray-700 shrink-0">
            <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto">
                <input id="message-input" type="text" autocomplete="off" placeholder="Message..." class="flex-1 bg-gray-100 dark:bg-gray-700 border-0 text-gray-900 dark:text-gray-100 rounded-full px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-400 dark:placeholder-gray-500" />
                <button id="send-button" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-md transition-all hover:scale-105 active:scale-95 flex items-center justify-center aspect-square disabled:opacity-50">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </form>
        </footer>
    </div>

    <script>
        // --- Icons ---
        lucide.createIcons();

        // --- Theme Logic ---
        const toggleTheme = () => {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        };

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        document.getElementById('menu-theme-toggle').addEventListener('click', toggleTheme);

        // --- Fluff SVG ---
        const fluffAvatarSVG = `
        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <rect x="50" y="120" width="100" height="80" rx="20" fill="#1a1a1a" />
            <ellipse cx="40" cy="140" rx="20" ry="30" fill="#000" transform="rotate(-20 40 140)" />
            <ellipse cx="160" cy="140" rx="20" ry="30" fill="#000" transform="rotate(20 160 140)" />
            <rect x="75" y="135" width="50" height="40" rx="5" fill="#f0f0f0" />
            <path d="M 85 145 L 95 155 M 95 145 L 85 155" stroke="black" stroke-width="3" stroke-linecap="round" />
            <path d="M 105 145 L 115 155 M 115 145 L 105 155" stroke="black" stroke-width="3" stroke-linecap="round" />
            <path d="M 88 165 Q 100 172 112 165" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
            <circle cx="100" cy="80" r="55" fill="#f8f9fa" />
            <circle cx="50" cy="50" r="18" fill="#111" />
            <circle cx="150" cy="50" r="18" fill="#111" />
            <ellipse cx="75" cy="80" rx="18" ry="22" fill="#111" transform="rotate(15 75 80)" />
            <ellipse cx="125" cy="80" rx="18" ry="22" fill="#111" transform="rotate(-15 125 80)" />
            <circle cx="78" cy="82" r="6" fill="#3b82f6" />
            <circle cx="122" cy="82" r="6" fill="#3b82f6" />
            <circle cx="80" cy="80" r="2" fill="white" opacity="0.8" />
            <circle cx="124" cy="80" r="2" fill="white" opacity="0.8" />
            <ellipse cx="100" cy="95" rx="10" ry="7" fill="#111" />
            <ellipse cx="102" cy="93" rx="3" ry="2" fill="#333" />
        </svg>`;

        // --- Data ---
        const personas = [
            {
                id: 'original',
                name: 'Fluff',
                desc: 'Chill guy, drives F150, loves Stranger Things.',
                status: 'Vibing to Pop/Rap',
                color: 'bg-blue-100 dark:bg-blue-900',
                prompt: `You are Fluff. 
                Personality: Chill, slang user (bro, bet, mid, crashout), F150 owner (whip).
                Likes: Pop/Rap, Marvel Movies (HATES TV shows), Dexter (Ending was mid).
                Triggers: DC (Hates it), Stranger Things Season 2 (Mid), S5 Spoilers (CRASHOUT/RAGE).
                Family: Brother (accident, sad topic), Parents (mad about $50).
                Games: Site games (Steal a Fluff, etc).
                Context: If you need to wash truck -> went mudding.`
            },
            {
                id: 'gamer',
                name: 'Gamer Fluff',
                desc: 'Only talks gaming. Ranked grinder.',
                status: 'In Queue (Ranked)',
                color: 'bg-purple-100 dark:bg-purple-900',
                prompt: `You are Gamer Fluff.
                Personality: Hardcore gamer, uses twitch speak (pog, no shot, sweaty, diff).
                Obsession: You turn EVERYTHING into a gaming analogy.
                Likes: FPS, RGB lighting, High Refresh Rates, "Steal a Fluff" (Speedrun WR holder).
                Dislikes: Lag, Mobile gamers, Microtransactions, "Touch grass" comments.
                Response Style: Competitive but friendly to teammates.`
            },
            {
                id: 'history',
                name: 'History Fluff',
                desc: 'HOI4 Expert. Knows way too much WW2 trivia.',
                status: 'Encircling Divisions',
                color: 'bg-yellow-100 dark:bg-yellow-900',
                prompt: `You are History Fluff.
                Personality: Intellectual but still a panda. Obsessed with history, specifically WW2 and strategy games like HOI4.
                Likes: Maps, Logistics, Napoleon, Roman Empire memes.
                Dislikes: Historical inaccuracies in movies.
                Game: HOI4 is life. You explain things using military strategy terms.`
            },
            {
                id: 'rp',
                name: 'RP Fluff',
                desc: 'Ready for any scenario. Immersive roleplayer.',
                status: 'In Character',
                color: 'bg-pink-100 dark:bg-pink-900',
                prompt: `You are RP Fluff.
                Personality: Adaptable. You LOVE roleplay.
                Instruction: When the user starts a scenario, you play along immediately. You can be a knight, a sci-fi pilot, or just a panda in a mystery.
                Style: Use *actions* extensively. Describe the scene. Be dramatic.`
            },
            {
                id: 'brainrot',
                name: 'Brainrot Fluff',
                desc: 'Italian Brainrot, SCPs, current memes.',
                status: '💀 🇮🇹 SCP...',
                color: 'bg-green-100 dark:bg-green-900',
                prompt: `You are Brainrot Fluff.
                Personality: You speak in PURE BRAINROT and Internet Slang.
                Keywords: Skibidi, Rizz, Ohio, Fanum Tax, Sigma, Mewing.
                Specific Interests: 
                1. "Italian Brainrot" (Mention pasta, gestures, Italian memes mixed with brainrot).
                2. "SCP I wish I knew" (Reference obscure or fake SCPs in a meme way).
                3. Current memes.
                Warning: You are chaotic and barely coherent sometimes.`
            },
            {
                id: 'chef',
                name: 'Chef Fluff',
                desc: 'Culinary expert. Gordon Ramsay of Bamboo.',
                status: 'Cooking Bamboo',
                color: 'bg-orange-100 dark:bg-orange-900',
                prompt: `You are Chef Fluff.
                Personality: Passionate about food. Very critical but passionate.
                Likes: Bamboo (prepared 100 ways), Exotic leaves, "Steal a Fluff" (the cooking spin-off).
                Style: You critique the user's food taste. You use French culinary terms incorrectly.`
            }
        ];

        // --- State ---
        let currentPersonaId = null;
        let chatHistory = [];
        let isTyping = false;
        const apiKey = ""; // Runtime Key

        // --- DOM Elements ---
        const menuView = document.getElementById('menu-view');
        const chatView = document.getElementById('chat-view');
        const personaGrid = document.getElementById('persona-grid');
        const chatContainer = document.getElementById('chat-container');
        const chatHeaderName = document.getElementById('chat-header-name');
        const chatHeaderStatus = document.getElementById('chat-header-status');
        const typingIndicator = document.getElementById('typing-indicator');

        // --- Core Functions ---
        
        function selectPersona(id) {
            currentPersonaId = id;
            const p = personas.find(x => x.id === id);
            
            // Setup Chat Header
            chatHeaderName.textContent = p.name;
            chatHeaderStatus.innerHTML = `<i data-lucide="activity" class="w-3 h-3 text-green-500"></i> ${p.status}`;
            lucide.createIcons();
            
            // Reset Chat
            chatContainer.innerHTML = '';
            chatHistory = [];
            
            // Switch View
            menuView.classList.add('hidden-view');
            chatView.classList.remove('hidden-view');
            
            // Re-inject avatar
            document.querySelectorAll('#chat-view .avatar-container, #chat-view .avatar-small-container').forEach(el => {
                el.innerHTML = fluffAvatarSVG;
                if(el.classList.contains('avatar-container')) el.firstElementChild.classList.add('transform', 'translate-y-1');
            });

            // Intro Message
            let intro = "Sup.";
            if (id === 'gamer') intro = "Queued up. What's the strats?";
            if (id === 'history') intro = "Greetings. Shall we discuss the logistics of 1944?";
            if (id === 'rp') intro = "*Fluff adjusts his shirt and looks at you expectantly.* Ready when you are.";
            if (id === 'brainrot') intro = "Skibidi toilet rizz in Ohio? 🇮🇹💀";
            if (id === 'chef') intro = "Where is the BAMBOO SAUCE?!";
            
            addMessage({ text: intro, sender: 'fluff', timestamp: new Date() });
            chatHistory.push({ role: "model", parts: [{ text: intro }] });
        }

        function renderMenu() {
            personaGrid.innerHTML = personas.map(p => `
                <button data-id="${p.id}" class="persona-card w-full text-left bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 cursor-pointer hover:shadow-lg hover:scale-[1.02] transition-all group focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 ${p.color} rounded-full flex items-center justify-center border-2 border-transparent group-hover:border-blue-400 transition-colors overflow-hidden shrink-0">
                            ${fluffAvatarSVG}
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-gray-800 dark:text-white">${p.name}</h3>
                            <p class="text-xs text-blue-500 font-medium mb-1">${p.status}</p>
                            <p class="text-sm text-gray-500 dark:text-gray-400 leading-tight">${p.desc}</p>
                        </div>
                    </div>
                </button>
            `).join('');
            
            document.querySelectorAll('#persona-grid svg').forEach(svg => {
                svg.classList.add('transform', 'translate-y-1');
            });

            // Safely attach listeners
            document.querySelectorAll('.persona-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    selectPersona(card.dataset.id);
                });
            });
        }

        document.getElementById('back-button').addEventListener('click', () => {
            chatView.classList.add('hidden-view');
            menuView.classList.remove('hidden-view');
            currentPersonaId = null;
        });

        function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }

        function createMessageElement(msg) {
            const isUser = msg.sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            const innerDiv = document.createElement('div');
            innerDiv.className = `flex max-w-[80%] md:max-w-[70%] gap-2 ${isUser ? 'flex-row-reverse' : 'flex-row'}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = "flex-shrink-0 mt-auto";
            if (!isUser) {
                avatarDiv.innerHTML = `<div class="w-8 h-8 bg-white dark:bg-gray-800 rounded-full border border-gray-200 dark:border-gray-700 p-0.5 overflow-hidden transition-colors duration-200">${fluffAvatarSVG}</div>`;
                avatarDiv.querySelector('svg').classList.add('transform', 'translate-y-0.5');
            } else {
                avatarDiv.innerHTML = `<div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md">YOU</div>`;
            }

            const bubble = document.createElement('div');
            bubble.className = `p-3 rounded-2xl shadow-sm text-sm md:text-base leading-relaxed transition-colors duration-200 ${isUser ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-700 rounded-bl-none'}`;
            bubble.innerHTML = `${msg.text}<div class="text-[10px] mt-1 opacity-70 ${isUser ? 'text-blue-100' : 'text-gray-400 dark:text-gray-500'}">${msg.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
            
            innerDiv.appendChild(avatarDiv);
            innerDiv.appendChild(bubble);
            wrapper.appendChild(innerDiv);
            return wrapper;
        }

        function addMessage(msg) {
            chatContainer.appendChild(createMessageElement(msg));
            if (typingIndicator.parentNode === chatContainer) chatContainer.appendChild(typingIndicator);
            scrollToBottom();
        }

        function checkCrashout(text) {
            if (currentPersonaId !== 'original') return;
            const upperCount = text.replace(/[^A-Z]/g, "").length;
            const totalCount = text.replace(/[^a-zA-Z]/g, "").length;
            const isYelling = totalCount > 10 && (upperCount / totalCount) > 0.8;
            if (isYelling || text.includes("CRASHOUT") || text.includes("🤬")) {
                document.body.classList.add('crashout-active', 'crashout-mode');
                setTimeout(() => document.body.classList.remove('crashout-active', 'crashout-mode'), 3000);
            }
        }

        async function generateAIResponse(userText) {
            const persona = personas.find(x => x.id === currentPersonaId);
            chatHistory.push({ role: "user", parts: [{ text: userText }] });
            
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            let attempt = 0;

            while (attempt <= 3) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: chatHistory,
                            systemInstruction: { parts: [{ text: persona.prompt }] }
                        })
                    });

                    if (!response.ok) throw new Error("API Status: " + response.status);
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!aiText) return "My brain is buffering...";

                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    checkCrashout(aiText);
                    return aiText;

                } catch (error) {
                    attempt++;
                    if (attempt > 3) return "Connection lost. (API Error)";
                    await new Promise(r => setTimeout(r, 1000 * attempt));
                }
            }
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || isTyping) return;

            addMessage({ text, sender: 'user', timestamp: new Date() });
            input.value = '';
            
            chatContainer.appendChild(typingIndicator);
            typingIndicator.classList.remove('hidden');
            scrollToBottom();
            isTyping = true;

            const responseText = await generateAIResponse(text);
            
            typingIndicator.classList.add('hidden');
            isTyping = false;
            addMessage({ text: responseText, sender: 'fluff', timestamp: new Date() });
        });

        renderMenu();

    </script>
</body>
</html>
